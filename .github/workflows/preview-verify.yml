name: Preview verification

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
  push:
    branches: ["cursor/**"]

concurrency:
  group: preview-${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read
  deployments: read

jobs:
  discover:
    name: Discover preview URL
    runs-on: ubuntu-latest
    outputs:
      preview_url: ${{ steps.discover.outputs.preview_url }}
      skipped: ${{ steps.discover.outputs.skipped }}
    steps:
      - uses: actions/checkout@v4

      - name: Discover Vercel preview deployment
        id: discover
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BRANCH_NAME: ${{ github.event.pull_request.head.ref || github.ref_name }}
          IS_FORK: ${{ github.event.pull_request.head.repo.full_name != github.repository && github.event_name == 'pull_request' }}
        run: |
          set +e
          RESOLVED_PR="$PR_NUMBER"
          if [ -z "$RESOLVED_PR" ] && [ -n "$BRANCH_NAME" ]; then
            RESOLVED_PR=$(gh pr list --head "$BRANCH_NAME" --state open --json number --jq '.[0].number' 2>/dev/null)
          fi
          if [ -z "$RESOLVED_PR" ] || [ "$RESOLVED_PR" = "null" ]; then
            echo "skipped=true" >> "$GITHUB_OUTPUT"
            echo "No open PR found for preview verification." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          export PR_NUMBER="$RESOLVED_PR"
          URL=$(node scripts/discover-vercel-preview.mjs 2>/dev/null)
          EXIT=$?
          set -e

          if [ "$EXIT" -eq 3 ]; then
            echo "skipped=true" >> "$GITHUB_OUTPUT"
            echo "Preview verification skipped (fork or missing context)." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if [ "$EXIT" -eq 2 ] || [ -z "$URL" ]; then
            echo "skipped=true" >> "$GITHUB_OUTPUT"
            echo "Preview URL not found yet — not failing CI." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo "preview_url=$URL" >> "$GITHUB_OUTPUT"
          echo "skipped=false" >> "$GITHUB_OUTPUT"
          echo "Preview URL: $URL" >> "$GITHUB_STEP_SUMMARY"

          HDR=()
          if [ -n "${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}" ]; then
            HDR=(-H "x-vercel-protection-bypass: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}")
          fi
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${HDR[@]}" "$URL/api/health" || echo "000")
          if [ "$STATUS" != "200" ]; then
            if [ -z "${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}" ]; then
              echo "skipped=true" >> "$GITHUB_OUTPUT"
              echo "Preview deployment is protected; smoke tests skipped (no bypass secret)." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "Preview /api/health returned HTTP $STATUS even with bypass secret." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

  smoke:
    name: Smoke test preview deployment
    runs-on: ubuntu-latest
    needs: discover
    if: needs.discover.outputs.skipped != 'true' && needs.discover.outputs.preview_url != ''
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npx playwright install --with-deps chromium

      - name: Preview smoke checks
        env:
          PLAYWRIGHT_BASE_URL: ${{ needs.discover.outputs.preview_url }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: npm run test:e2e:preview

      - name: Upload preview smoke artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: preview-smoke-failure
          path: test-results/**
          retention-days: 7
