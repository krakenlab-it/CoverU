name: CI

# Validates lint, types, unit/integration tests, migrations, build, and Playwright.
on:
  push:
    branches: [main, "cursor/**"]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

env:
  NODE_VERSION_FILE: .nvmrc
  NEXT_PUBLIC_SUPABASE_URL: ""
  NEXT_PUBLIC_SUPABASE_ANON_KEY: ""
  COVERAGE_QA_PROVIDER: demo

jobs:
  verify:
    name: Lint, typecheck, unit & migration checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck (strict)
        run: npm run typecheck

      - name: Unit & integration tests
        run: npm run test:unit

      - name: Migration static validation
        run: npm run validate:migrations

      - name: Data pipeline scaffolding tests
        run: npm run test:data-pipeline

      - name: Upload unit test artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: verify-failure-logs
          path: |
            coverage/**
          if-no-files-found: ignore

  build:
    name: Production build
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci
      - run: npm run build

      - name: Upload build artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-failure-next-logs
          path: .next/trace
          if-no-files-found: ignore

  migrations-ephemeral:
    name: Ephemeral Postgres migration apply
    runs-on: ubuntu-latest
    needs: verify
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: coveru
          POSTGRES_PASSWORD: coveru
          POSTGRES_DB: coveru_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U coveru -d coveru_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://coveru:coveru@localhost:5432/coveru_test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - run: npm run test:migrations:ephemeral

  e2e:
    name: Playwright smoke & accessibility
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci
      - run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Playwright smoke tests
        run: npm run test:e2e

      - name: Accessibility tests
        run: npm run test:a11y

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/**
            test-results/**
          retention-days: 7
